name: Pages

on:
  schedule:
    - cron: '40 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Copy live data into dashboard (paper, brain, system, reality, verification)"
        run: |
          mkdir -p dashboard/results
          for f in paper.json brain.json system.json reality.json progress.json verification.json; do
            if [ -f scalp-lab/results/$f ]; then cp scalp-lab/results/$f dashboard/results/$f; fi
          done
          if [ -f scalp-lab/results/archive/stats.json ]; then
            mkdir -p dashboard/results/archive
            cp scalp-lab/results/archive/stats.json dashboard/results/archive/stats.json
          fi
          ls -la dashboard/results || true

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - uses: actions/deploy-pages@v4
