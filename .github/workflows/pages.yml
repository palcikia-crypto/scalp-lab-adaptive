name: Pages\n\non:\n  schedule:\n    - cron: '40 * * * *'\n  workflow_dispatch:\n  push:\n    branches: [main]\n    paths:\n      - 'dashboard/**'\n      - '.github/workflows/pages.yml'\n\npermissions:\n  contents: read\n  pages: write\n  id-token: write\n\nconcurrency:\n  group: pages\n  cancel-in-progress: true\n\njobs:\n  deploy:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n\n      - name: "Point dashboard to this repo (patch data source at deploy)"\n        run: |\n          LIST=$(awk 'BEGIN{printf "[\\\"queue.json\\\"";for(i=2;i<=200;i++)printf ",\\\"queue%d.json\\\"",i;printf "]"}')\n          if [ -f dashboard/index.html ]; then\n            sed -i 's/palcikia-crypto\\/scalp-lab-termux/palcikia-crypto\\/scalp-lab-adaptive/g' dashboard/index.html\n            perl -0777 -pe "s/var QUEUE_FILES = \\[[^]]*\\];/var QUEUE_FILES = $LIST;/s" -i dashboard/index.html\n          fi\n\n      - name: "Copy live data into dashboard (paper, brain, system, reality)"\n        run: |\n          mkdir -p dashboard/results\n          for f in paper.json brain.json system.json reality.json progress.json; do\n            if [ -f scalp-lab/results/$f ]; then cp scalp-lab/results/$f dashboard/results/$f; fi\n          done\n          ls -la dashboard/results || true\n\n      - uses: actions/configure-pages@v5\n\n      - uses: actions/upload-pages-artifact@v3\n        with:\n          path: dashboard\n\n      - uses: actions/deploy-pages@v4\n