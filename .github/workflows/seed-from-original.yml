name: Seed from original

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seed-from-original.yml'

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Copy history from natural repo into the worker pool
        run: |
          git clone --depth 1 https://github.com/palcikia-crypto/scalp-lab-termux.git /tmp/orig
          mkdir -p scalp-lab/results/backtest scalp-lab/results/scan scalp-lab/results/gold reports
          cp -r /tmp/orig/scalp-lab/results/backtest/* scalp-lab/results/backtest/ 2>/dev/null || true
          cp -r /tmp/orig/scalp-lab/results/scan/* scalp-lab/results/scan/ 2>/dev/null || true
          cp /tmp/orig/scalp-lab/results/queue*.json scalp-lab/results/ 2>/dev/null || true
          cp /tmp/orig/scalp-lab/results/history.json scalp-lab/results/ 2>/dev/null || true
          cp /tmp/orig/scalp-lab/scalp-lab/results/gold/* scalp-lab/results/gold/ 2>/dev/null || true
          cp /tmp/orig/scalp-lab/reports/* reports/ 2>/dev/null || true
          echo "backtest files: $(ls scalp-lab/results/backtest | wc -l)"
          echo "scan files: $(ls scalp-lab/results/scan | wc -l)"

      - name: Commit seed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "nothing to seed" || git commit -m "seed: history captured from original into worker pool"
          git push || (git fetch origin && git rebase origin/main && git push)
