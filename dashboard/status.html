<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScalpLab Adaptive — статус системы</title>
<style>
  :root { --bg:#0b0e14; --card:#151a23; --line:#232a36; --txt:#d8dee9; --dim:#7a8496;
          --green:#2ecc71; --red:#e74c3c; --gold:#f1c40f; --blue:#4aa3ff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--txt); font-family:ui-monospace,Menlo,Consolas,monospace; padding:16px; }
  h1 { font-size:18px; margin-bottom:4px; }
  .sub { color:var(--dim); font-size:12px; margin-bottom:16px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .card h2 { font-size:13px; color:var(--blue); margin-bottom:10px; text-transform:uppercase; letter-spacing:.5px; }
  .big { font-size:26px; font-weight:700; }
  .row { display:flex; justify-content:space-between; padding:4px 0; font-size:13px; border-bottom:1px dashed var(--line); }
  .row:last-child { border-bottom:none; }
  .up { color:var(--green); } .down { color:var(--red); } .gold { color:var(--gold); }
  .bar { height:8px; background:var(--line); border-radius:4px; overflow:hidden; margin-top:6px; }
  .bar > div { height:100%; background:var(--blue); }
  .muted { color:var(--dim); font-size:12px; }
  .badge { display:inline-block; padding:2px 8px; border-radius:6px; font-size:11px; background:var(--line); margin:2px 2px 0 0; }
  .alert { color:var(--red); font-size:12px; padding:2px 0; }
</style>
</head>
<body>
<h1>🧠 ScalpLab Adaptive — статус системы</h1>
<div class="sub">конвейер · золото · мозг · страж реальности · обновление каждые 60 сек</div>
<div class="grid" id="grid">загрузка…</div>
<script>
function fmt(x, d) { return (x === null || x === undefined) ? '—' : Number(x).toFixed(d === undefined ? 2 : d); }
function pctClass(x) { return x > 0 ? 'up' : (x < 0 ? 'down' : ''); }
async function main() {
  let s = {};
  try { s = await (await fetch('system.json?v=' + Date.now())).json(); } catch (e) {
    document.getElementById('grid').innerHTML = '<div class="card">system.json пока не готов — дождитесь первого прогона воркера</div>'; return;
  }
  const q = s.queue || {}, g = s.gold || {}, b = s.brain || {}, r = s.reality || {}, p = s.paper || {};
  const st = p.portfolio || [];
  let html = '';
  html += '<div class="card"><h2>Конвейер</h2>'
    + '<div class="row"><span>Стадия</span><b>' + (s.stage || '—') + '</b></div>'
    + '<div class="row"><span>Прогресс очереди</span><b>' + fmt(q.progress_pct, 1) + '%</b></div>'
    + '<div class="bar"><div style="width:' + fmt(q.progress_pct, 0) + '%"></div></div>'
    + '<div class="row"><span>Задач готово</span><span>' + (q.done || 0) + ' / ' + (q.total || 0) + '</span></div>'
    + '<div class="row"><span>В работе / ошибок</span><span>' + (q.pending || 0) + ' / ' + (q.errors || 0) + '</span></div></div>';
  html += '<div class="card"><h2>Золотое подтверждение</h2>'
    + '<div class="big ' + (g.passed > 0 ? 'gold' : '') + '">' + (g.passed || 0) + ' / ' + (g.checked || 0) + '</div>'
    + '<div class="muted">стратегий прошли все проверки (соседи, подпериоды, Monte Carlo)</div>';
  (g.passed_list || []).slice(0, 8).forEach(x => { html += '<span class="badge gold">' + x.key + '</span>'; });
  if (!g.passed_list || !g.passed_list.length) html += '<div class="muted" style="margin-top:8px">Пока ни одна не прошла — фильтр жёсткий, это защита от подгонок. Кандидаты продолжают проверяться.</div>';
  html += '</div>';
  html += '<div class="card"><h2>Мозг рынка (маш. обучение)</h2>';
  const reg = b.regimes || {};
  const regStr = Object.keys(reg).length ? Object.entries(reg).map(([k, v]) => k + '×' + v).join(', ') : '—';
  html += '<div class="row"><span>Режимы сейчас</span><span>' + regStr + '</span></div>';
  const ln = b.learned || {}, cf = b.confidence_pct || {};
  const keys = Object.keys(ln);
  if (keys.length) keys.forEach(k => {
    const v = ln[k], c = cf[k] || 0;
    html += '<div class="row"><span>' + k + '</span><span class="' + (v > 0.05 ? 'up' : (v < -0.05 ? 'down' : '')) + '">'
      + fmt(v, 3) + '%/сделку · уверенность ' + c + '%</span></div>';
  });
  else html += '<div class="muted">Копит опыт: после 3 сделок в режиме начнёт подстраивать веса, полная уверенность — к 12</div>';
  html += '</div>';
  html += '<div class="card"><h2>Страж реальности</h2>'
    + '<div class="row"><span>Глобальный размер</span><b class="' + ((r.mult || 1) < 1 ? 'down' : 'up') + '">×' + fmt(r.mult || 1, 2) + '</b></div>'
    + '<div class="row"><span>Просадка от пика</span><span>' + fmt(r.drawdown_pct, 2) + '%</span></div>';
  (r.alerts || []).slice(0, 5).forEach(a => { html += '<div class="alert">⚠ ' + a + '</div>'; });
  if (!(r.alerts || []).length) html += '<div class="muted">Алертов нет — исполнение и арифметика в норме</div>';
  html += '</div>';
  html += '<div class="card"><h2>Paper-счёт</h2>'
    + '<div class="big ' + pctClass(p.pnl_pct) + '">' + fmt(p.equity) + ' $</div>'
    + '<div class="row"><span>PnL</span><span class="' + pctClass(p.pnl_pct) + '">' + fmt(p.pnl_pct) + '%</span></div>'
    + '<div class="row"><span>Сделок / винрейт</span><span>' + (p.n_trades || 0) + ' / ' + fmt(p.winrate, 1) + '%</span></div>'
    + '<div class="row"><span>Открыто позиций</span><span>' + (p.open || 0) + '</span></div></div>';
  html += '<div class="card"><h2>Портфель (веса в реальном времени)</h2>';
  if (st.length) st.forEach(t => {
    html += '<div class="row"><span>' + t.key + (t.gold ? ' <span class="gold">★</span>' : '') + '</span>'
      + '<span>вес ' + fmt(t.weight, 2) + ' · режим ×' + fmt(t.fit, 2) + ' · сигнал ' + fmt(t.signal, 0) + '</span></div>';
  });
  else html += '<div class="muted">Портфель формируется — волны проверяют кандидатов</div>';
  html += '</div>';
  if ((s.recent_errors || []).length) {
    html += '<div class="card"><h2>Последние ошибки (аудит)</h2>';
    s.recent_errors.forEach(e => { html += '<div class="alert">' + e.id + ': ' + (e.error || '') + '</div>'; });
    html += '</div>';
  }
  document.getElementById('grid').innerHTML = html;
}
main();
setInterval(main, 60000);
</script>
</body>
</html>
