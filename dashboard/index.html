<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScalpLab Adaptive — панель</title>
<style>
  :root { --bg:#0b0e14; --card:#151a23; --line:#232a36; --txt:#d8dee9; --dim:#7a8496;
          --green:#2ecc71; --red:#e74c3c; --gold:#f1c40f; --blue:#4aa3ff; --warn:#e67e22; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--txt); font-family:ui-monospace,Menlo,Consolas,monospace; padding:16px; max-width:1100px; margin:0 auto; }
  h1 { font-size:18px; margin-bottom:2px; }
  .sub { color:var(--dim); font-size:12px; margin-bottom:14px; }
  .stale { background:#3a1f0e; border:1px solid var(--warn); color:var(--warn); border-radius:8px; padding:10px 12px; font-size:13px; margin-bottom:14px; display:none; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .card h2 { font-size:12px; color:var(--blue); margin-bottom:10px; text-transform:uppercase; letter-spacing:.5px; }
  .big { font-size:26px; font-weight:700; }
  .row { display:flex; justify-content:space-between; padding:4px 0; font-size:13px; border-bottom:1px dashed var(--line); }
  .row:last-child { border-bottom:none; }
  .up { color:var(--green); } .down { color:var(--red); } .gold { color:var(--gold); } .warn { color:var(--warn); }
  .muted { color:var(--dim); font-size:12px; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th { text-align:left; color:var(--dim); font-weight:normal; padding:3px 4px; border-bottom:1px solid var(--line); }
  td { padding:3px 4px; border-bottom:1px dashed var(--line); }
  .q { display:flex; flex-wrap:wrap; gap:8px; }
  .q div { background:var(--line); border-radius:8px; padding:6px 10px; font-size:12px; }
  .q b { font-size:13px; margin-left:6px; }
</style>
</head>
<body>
<h1>🧠 ScalpLab Adaptive</h1>
<div class="sub">paper-счёт · мозг рынка · страж реальности · обновление раз в 60 сек</div>
<div class="stale" id="stale">⚠ Данные конвейера устарели: <span id="stale_when"></span>. Это значит, что шаги paper/brain/reality не отработали — чинится, смотри отчёт агента.</div>
<div class="grid" id="grid">загрузка…</div>
<script>
function fmt(x, d) { return (x === null || x === undefined || isNaN(x)) ? '—' : Number(x).toFixed(d === undefined ? 2 : d); }
function cls(x) { return x > 0 ? 'up' : (x < 0 ? 'down' : ''); }
async function jget(u) { const r = await fetch(u + '?v=' + Date.now()); if (!r.ok) throw 0; return r.json(); }

async function quotes() {
  const syms = ['BTCUSDT','ETHUSDT','SOLUSDT','DOGEUSDT','XRPUSDT','NEARUSDT'];
  const el = document.getElementById('q');
  try {
    const d = await jget('https://data-api.binance.vision/api/v3/ticker/24hr?symbols=' + JSON.stringify(syms));
    el.innerHTML = d.map(t => '<div>' + t.symbol.replace('USDT','') + '<b>' + fmt(t.lastPrice, t.lastPrice < 1 ? 5 : 2) +
      '</b> <span class="' + cls(t.priceChangePercent) + '">' + (t.priceChangePercent > 0 ? '▲' : '▼') + ' ' + fmt(t.priceChangePercent, 2) + '%</span></div>').join('');
  } catch (e) { el.innerHTML = '<div class="muted">котировки недоступны</div>'; }
}

function staleness(p) {
  let last = null;
  (p.closed || []).forEach(t => { if (t.closed_ts && (!last || t.closed_ts > last)) last = t.closed_ts; });
  if (!last) return;
  const ageH = (Date.now() - new Date(last.replace(' ', 'T') + 'Z')) / 3.6e6;
  if (ageH > 6) {
    document.getElementById('stale').style.display = 'block';
    document.getElementById('stale_when').textContent = 'последняя активность ' + last + ' UTC (' + Math.round(ageH) + ' ч назад)';
  }
}

async function main() {
  const g = document.getElementById('grid');
  let p = {}, b = {}, r = {}, s = {};
  const errs = [];
  await Promise.all([
    jget('results/paper.json').then(d => p = d).catch(() => errs.push('paper')),
    jget('results/brain.json').then(d => b = d).catch(() => errs.push('brain')),
    jget('results/reality.json').then(d => r = d).catch(() => errs.push('reality')),
    jget('results/system.json').then(d => s = d).catch(() => {})
  ]);
  if (errs.length === 4) { g.innerHTML = '<div class="card">Данные пока не загружаются — ждём первый успешный прогон воркера.</div>'; return; }
  let h = '';
  // Paper-счёт
  h += '<div class="card"><h2>Paper-счёт</h2>'
    + '<div class="big ' + cls(p.equity - 1000) + '">' + fmt(p.equity) + ' $</div>'
    + '<div class="muted">старт 1000 $</div>'
    + '<div class="row"><span>PnL</span><span class="' + cls(p.equity - 1000) + '">' + fmt((p.equity / 1000 - 1) * 100) + '%</span></div>'
    + '<div class="row"><span>Закрытых сделок</span><span>' + (p.closed || []).length + '</span></div>'
    + '<div class="row"><span>Открыто позиций</span><span>' + Object.keys(p.positions || {}).length + '</span></div></div>';
  // Последние сделки
  const cl = (p.closed || []).slice(-8).reverse();
  h += '<div class="card"><h2>Последние сделки</h2>';
  if (cl.length) {
    h += '<table><tr><th>стратегия</th><th>символ</th><th>сторона</th><th>PnL %</th><th>закрыта</th></tr>';
    cl.forEach(t => {
      h += '<tr><td>' + t.strategy + (t.shadow ? ' <span class="muted">(shadow)</span>' : '') + '</td><td>' + t.symbol +
        '</td><td>' + t.side + '</td><td class="' + cls(t.pnl_pct) + '">' + fmt(t.pnl_pct, 2) + '</td><td class="muted">' + (t.closed_ts || '') + '</td></tr>';
    });
    h += '</table>';
  } else h += '<div class="muted">Сделок пока нет</div>';
  h += '</div>';
  // Мозг рынка
  const reg = b.regimes || {}, ln = b.learned || {};
  h += '<div class="card"><h2>Мозг рынка</h2>';
  const rk = Object.keys(reg);
  h += '<div class="row"><span>Режимы сейчас</span><span>' + (rk.length ? rk.map(k => k + '×' + reg[k]).join(', ') : '—') + '</span></div>';
  const lk = Object.keys(ln);
  if (lk.length) lk.forEach(k => {
    h += '<div class="row"><span>' + k + '</span><span class="' + cls(ln[k]) + '">' + fmt(ln[k], 3) + '%/сделку</span></div>';
  }); else h += '<div class="muted">Копит опыт: веса подстроятся после первых сделок</div>';
  h += '</div>';
  // Страж реальности
  h += '<div class="card"><h2>Страж реальности</h2>'
    + '<div class="row"><span>Глобальный размер</span><b class="' + ((r.mult || 1) < 1 ? 'down' : 'up') + '">×' + fmt(r.mult || 1, 2) + '</b></div>'
    + '<div class="row"><span>Просадка от пика</span><span>' + fmt(r.drawdown_pct, 2) + '%</span></div>';
  (r.alerts || []).slice(0, 5).forEach(a => { h += '<div class="warn">⚠ ' + a + '</div>'; });
  if (!(r.alerts || []).length) h += '<div class="muted">Алертов нет</div>';
  h += '</div>';
  // Золото
  const gold = (s.gold && s.gold.passed_list) || [];
  h += '<div class="card"><h2>Золотой статус</h2>';
  if (gold.length) gold.slice(0, 10).forEach(x => { h += '<div class="row"><span>' + x.key + '</span><span class="gold">★ прошёл</span></div>'; });
  else h += '<div class="muted">Пока ни одна стратегия не прошла полную проверку (соседи, подпериоды, Monte Carlo) — фильтр жёсткий, это защита от подгонок</div>';
  h += '</div>';
  g.innerHTML = h;
  staleness(p);
}

quotes();
main();
setInterval(quotes, 10000);
setInterval(main, 60000);
</script>
<div style="margin-top:20px" class="q" id="q"></div>
</body>
</html>
